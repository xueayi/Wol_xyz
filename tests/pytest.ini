[pytest]
testpaths = scenarios
asyncio_mode = auto
markers =
    web_api: Web UI API trigger tests
    external_api: External HTTP API trigger tests
    scheduler: Scheduled task trigger tests
    bemfa: Bemfa TCP trigger tests
    mqtt: MQTT trigger tests
    telegram: Telegram bot trigger tests
    cross_platform: Multi-platform command tests
    multi_device: Multi-device batch operation tests
